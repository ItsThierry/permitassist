<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PermitAssist Report</title>
  <style>
    :root { --bg:#f8fafc; --card:#fff; --text:#0f172a; --muted:#64748b; --brand:#2563eb; --border:#e2e8f0; --green:#059669; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Inter,system-ui,sans-serif; background:var(--bg); color:var(--text); }
    .wrap { max-width:980px; margin:0 auto; padding:32px 20px 80px; }
    .hero { background:linear-gradient(135deg, rgba(37,99,235,.09), rgba(255,255,255,.96)); border:1px solid rgba(37,99,235,.15); border-radius:24px; padding:28px; margin-bottom:18px; }
    .brand { display:flex; align-items:center; gap:12px; margin-bottom:18px; }
    .mark { width:44px; height:44px; border-radius:14px; background:var(--brand); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; }
    .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:18px; padding:22px; box-shadow:0 10px 30px rgba(15,23,42,.05); }
    .label { font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.08em; color:var(--brand); margin-bottom:10px; }
    .headline { font-size:32px; line-height:1.08; font-weight:900; margin:0 0 6px; }
    .sub { color:var(--muted); font-size:15px; }
    .pill { display:inline-flex; align-items:center; gap:8px; margin-top:14px; padding:8px 14px; border-radius:999px; background:rgba(5,150,105,.12); color:var(--green); font-weight:800; }
    .meta { display:grid; gap:12px; }
    .meta-row { display:flex; justify-content:space-between; gap:16px; padding-bottom:12px; border-bottom:1px solid var(--border); font-size:14px; }
    .meta-row:last-child { border-bottom:none; padding-bottom:0; }
    ul { margin:0; padding-left:18px; }
    li { margin:8px 0; color:#334155; }
    .cta { margin-top:18px; background:#0f172a; color:#fff; border-radius:20px; padding:20px; display:flex; align-items:center; justify-content:space-between; gap:16px; }
    .cta a, .print-btn { background:#fff; color:#0f172a; text-decoration:none; border:none; border-radius:12px; padding:12px 16px; font-weight:800; cursor:pointer; }
    .source-list a { color:var(--brand); overflow-wrap:anywhere; }
    @media (max-width: 760px) { .grid { grid-template-columns:1fr; } .headline { font-size:26px; } .cta { flex-direction:column; align-items:flex-start; } }
    @media print {
      body { background:#fff; }
      .wrap { max-width:none; padding:0; }
      .cta, .print-actions { display:none !important; }
      .card, .hero { box-shadow:none; break-inside:avoid; }
      a { color:#000; text-decoration:none; }
    }
  </style>
</head>
<body>
  <div class="wrap" id="app"></div>
  <script id="report-data" type="application/json">__REPORT_DATA__</script>
  <script>
    const payload = JSON.parse(document.getElementById('report-data').textContent);
    const share = payload.share || {};
    const d = share.data || {};
    const checklist = payload.checklist || {};
    const primaryPermit = (d.primary_permit && typeof d.primary_permit === 'object') ? d.primary_permit : {};
    const firstPermit = Array.isArray(d.permits_required) && d.permits_required[0] ? d.permits_required[0] : {};
    const textValue = (value, fallback = '') => {
      if (value === null || value === undefined) return fallback;
      return String(value);
    };
    const safeArray = (value) => Array.isArray(value) ? value : [];
    const packetRows = safeArray(d.public_packet_rows || (d.public_packet && d.public_packet.rows));
    const requiredPacketRows = packetRows.filter(r => r && r.decision === 'REQUIRED');
    const conditionalPacketRows = packetRows.filter(r => r && r.decision === 'CONDITIONAL');
    const packetDocs = [...new Set(safeArray(d.public_packet && d.public_packet.documents).map(x => textValue(x)).filter(Boolean))];
    const packetInspections = [...new Set(safeArray(d.public_packet && d.public_packet.inspections).map(x => textValue(x)).filter(Boolean))];
    const permitName = textValue((requiredPacketRows[0] && requiredPacketRows[0].permit_name) || d.permit_name || d.permit_type || primaryPermit.permit_type || firstPermit.permit_type, 'Permit details');
    const rawVerdict = textValue(d.permit_verdict).toUpperCase();
    const verdict = rawVerdict || (d.permit_required === true ? 'YES' : d.permit_required === false ? 'NO' : 'VERIFY');
    const verdictLabel = verdict === 'YES' ? 'Permit required: Yes' : (verdict === 'NO' ? 'Permit required: No' : 'Permit status: Verify');
    const timeline = textValue((d.approval_timeline && (d.approval_timeline.simple || d.approval_timeline.complex)) || d.timeline, 'Varies by jurisdiction');
    const docs = packetDocs;
    const inspectionLabel = (item) => {
      if (typeof item === 'string') return item;
      if (!item || typeof item !== 'object') return '';
      return textValue(item.stage || item.title || item.name || item.description);
    };
    const inspections = packetInspections;
    const sources = safeArray(d.sources);
    const sourceUrl = (src) => typeof src === 'string' ? src : ((src && src.url) || '');
    const safeExternalUrl = (url, fallback = '') => {
      try {
        const parsed = new URL(String(url || '').trim(), window.location.origin);
        if (parsed.protocol === 'http:' || parsed.protocol === 'https:') return parsed.href;
      } catch {}
      return fallback;
    };
    const sourceHost = (url) => {
      try { return new URL(url).hostname.replace(/^www\./,''); } catch { return 'official source'; }
    };
    const sourceTitle = (src) => textValue((src && typeof src === 'object' && (src.title || src.name || src.label)) || sourceHost(sourceUrl(src)), 'official source');
    const looksLikeRawUrl = (value) => /^https?:\/\//i.test(String(value || '').trim());
    const applyPath = d.apply_path && typeof d.apply_path === 'object' ? d.apply_path : {};
    const applyPathLabel = primaryPermit.portal_selection || firstPermit.portal_selection || applyPath.likely_path || applyPath.label || applyPath.permit_path;
    const applyOffice = looksLikeRawUrl(d.applying_office) ? '' : d.applying_office;
    const applyAddress = looksLikeRawUrl(d.apply_address) ? '' : d.apply_address;
    const applyPhone = looksLikeRawUrl(d.apply_phone) ? '' : d.apply_phone;
    const applyContactLabel = [applyOffice, applyAddress, applyPhone].filter(Boolean).join(' • ');
    const whereToApply = textValue(applyContactLabel || applyPathLabel, 'Contact local building department');

    const el = (tag, options = {}, children = []) => {
      const node = document.createElement(tag);
      if (options.className) node.className = options.className;
      if (options.text !== undefined) node.textContent = textValue(options.text);
      if (options.style) node.setAttribute('style', options.style);
      if (options.attrs) {
        for (const [name, value] of Object.entries(options.attrs)) {
          if (value !== null && value !== undefined && value !== '') node.setAttribute(name, String(value));
        }
      }
      for (const child of children) {
        if (child === null || child === undefined) continue;
        node.appendChild(typeof child === 'string' ? document.createTextNode(child) : child);
      }
      return node;
    };
    const addText = (parent, tag, options = {}, children = []) => {
      const node = el(tag, options, children);
      parent.appendChild(node);
      return node;
    };
    const listCard = (title, items, fallback) => {
      const card = el('div', { className: 'card' });
      addText(card, 'div', { className: 'label', text: title });
      const ul = addText(card, 'ul');
      const finalItems = (items && items.length ? items : [fallback]).map(x => textValue(x)).filter(Boolean);
      for (const item of finalItems) addText(ul, 'li', { text: item });
      return card;
    };
    const metaRow = (label, value) => el('div', { className: 'meta-row' }, [
      el('strong', { text: label }),
      el('span', { text: value }),
    ]);

    const app = document.getElementById('app');
    const fragment = document.createDocumentFragment();

    const hero = addText(fragment, 'section', { className: 'hero' });
    const brand = addText(hero, 'div', { className: 'brand' });
    addText(brand, 'div', { className: 'mark', text: 'PA' });
    const brandCopy = addText(brand, 'div');
    addText(brandCopy, 'div', { text: 'PermitAssist', style: 'font-weight:900;font-size:20px' });
    addText(brandCopy, 'div', { className: 'sub', text: 'Permit Intelligence Report' });

    const printActions = addText(hero, 'div', {
      className: 'print-actions',
      style: 'display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap'
    });
    const heroText = addText(printActions, 'div');
    addText(heroText, 'h1', { className: 'headline', text: permitName });
    addText(heroText, 'div', { className: 'sub', text: `${textValue(share.job_type)} in ${textValue(share.city)}, ${textValue(share.state)}` });
    addText(heroText, 'div', { className: 'pill', text: verdictLabel });
    const printButton = addText(printActions, 'button', { className: 'print-btn', text: '🖨️ Print / Save PDF' });
    printButton.addEventListener('click', () => window.print());

    const grid = addText(fragment, 'section', { className: 'grid' });
    const coreCard = addText(grid, 'div', { className: 'card' });
    addText(coreCard, 'div', { className: 'label', text: 'Core details' });
    const meta = addText(coreCard, 'div', { className: 'meta' });
    meta.appendChild(metaRow('Jurisdiction', `${textValue(share.city)}, ${textValue(share.state)}`));
    meta.appendChild(metaRow('Permit', permitName));
    meta.appendChild(metaRow('Fees', textValue(d.fee_range, 'Call to confirm')));
    meta.appendChild(metaRow('Timeline', timeline));
    meta.appendChild(metaRow('Where to apply', whereToApply));

    const summaryCard = addText(grid, 'div', { className: 'card' });
    addText(summaryCard, 'div', { className: 'label', text: 'Summary' });
    addText(summaryCard, 'div', {
      className: 'sub',
      style: 'color:#334155',
      text: (d.public_packet && d.public_packet.summary) || d.customer_result_summary || d.summary || d.job_summary || d.permit_summary || 'Permit requirements generated from PermitAssist research.'
    });

    grid.appendChild(listCard('Required documents', docs, 'Scope of work'));
    const conditionalItems = conditionalPacketRows.map(r => `${textValue(r.conditional_text || 'Only if triggered')} — ${textValue(r.permit_name)}`).filter(Boolean);
    if (conditionalItems.length) grid.appendChild(listCard('Conditional guidance', conditionalItems, 'No conditional permits identified.'));
    const inspectionFallback = [];
    grid.appendChild(listCard('Inspection checklist', inspections.length ? inspections : inspectionFallback, 'Confirm inspection phases with the jurisdiction.'));
    const preconstructionItems = safeArray(checklist.items).map(item => item && item.label).filter(Boolean);
    const preconstructionFallback = verdict === 'NO'
      ? 'Keep this no-permit report with the job record and verify before expanding the scope.'
      : 'Pull permit before starting work';
    grid.appendChild(listCard('Pre-construction checklist', preconstructionItems, preconstructionFallback));

    const sourceRows = sources.map(src => ({ src, url: safeExternalUrl(sourceUrl(src)) })).filter(row => row.url);
    if (sourceRows.length) {
      const sourceCard = addText(grid, 'div', { className: 'card' });
      addText(sourceCard, 'div', { className: 'label', text: 'Sources checked' });
      const ul = addText(sourceCard, 'ul', { className: 'source-list' });
      for (const row of sourceRows) {
        const li = addText(ul, 'li');
        const link = addText(li, 'a', { attrs: { href: row.url, target: '_blank', rel: 'noopener' } });
        addText(link, 'strong', { text: sourceTitle(row.src) });
      }
    }

    const cta = addText(fragment, 'section', { className: 'cta' });
    const ctaCopy = addText(cta, 'div');
    addText(ctaCopy, 'div', { text: 'Get your own permits instantly at permitassist.io', style: 'font-size:20px;font-weight:900;margin-bottom:6px' });
    addText(ctaCopy, 'div', { text: 'Shareable permit reports, contractor checklists, and faster office handoffs.', style: 'color:rgba(255,255,255,.78)' });
    addText(cta, 'a', { text: 'Try PermitAssist', attrs: { href: safeExternalUrl(payload.app_base_url, 'https://permitassist.io') } });

    app.replaceChildren(fragment);
    document.title = `${permitName} | PermitAssist Report`;
  </script>
</body>
</html>
