<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>PermitAssist Report</title>
  <style>
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; background: #f8fafc; color: #0f172a; }
    main { max-width: 840px; margin: 0 auto; padding: 32px 20px 56px; }
    section { background: #fff; border: 1px solid #e2e8f0; border-radius: 14px; padding: 18px 20px; margin: 16px 0; box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04); }
    h1 { font-size: 28px; line-height: 1.2; margin: 0 0 8px; }
    h2 { font-size: 15px; letter-spacing: 0.08em; text-transform: uppercase; color: #475569; margin: 0 0 12px; }
    .meta { color: #475569; margin: 0 0 20px; }
    .badge { display: inline-block; border-radius: 999px; padding: 5px 10px; background: #dbeafe; color: #1e40af; font-weight: 700; font-size: 13px; }
    .badge.no { background: #dcfce7; color: #166534; }
    .badge.invalid { background: #fee2e2; color: #991b1b; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; vertical-align: top; border-top: 1px solid #e2e8f0; padding: 10px 0; }
    th { width: 34%; color: #475569; font-weight: 600; padding-right: 16px; }
    a { color: #2563eb; overflow-wrap: anywhere; }
    button { border: 0; border-radius: 10px; padding: 10px 14px; background: #0f172a; color: #fff; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <main id="app"></main>
  <script id="report-data" type="application/json">__REPORT_DATA__</script>
  <script>
    const rawText = document.getElementById('report-data').textContent || '{}';
    let payload = {};
    try { payload = JSON.parse(rawText); } catch (_) { payload = {}; }
    const share = payload.share || {};
    const view = share.data || payload.result || {};
    const esc = value => String(value ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
    const isCustomerView = view.view_type === 'CustomerView';
    const isInvalid = view.final_answer_state === 'OUT_OF_SCOPE' || view.permit_required === null;
    const isNoPermit = view.permit_required === false;
    const status = isInvalid ? 'Invalid/Unsupported Jurisdiction' : (isNoPermit ? 'No Permit Required' : 'Permit Required');
    const badgeClass = isInvalid ? 'invalid' : (isNoPermit ? 'no' : '');
    const defaultPath = isInvalid
      ? 'Invalid/Unsupported Jurisdiction — PermitAssist cannot issue a permit answer for this location.'
      : (isNoPermit
        ? 'No Permit Required — source-backed guidance; keep the cited source with the job record.'
        : 'Permit Required — source-backed guidance; exact application path needs permitting-office confirmation before filing.');
    const title = isCustomerView
      ? (view.filing_path || view.permit_name || view.official_portal_category_path || defaultPath)
      : defaultPath;
    const safeRows = [
      ['Final answer', status],
      ['Required', isInvalid ? 'Not applicable' : (isNoPermit ? 'No' : 'Yes')],
      ['Permit / application / form', view.permit_name || 'Not separately named by source'],
      ['Official portal category/path', view.official_portal_category_path || 'Not separately named by source'],
      ['Filing path', view.filing_path || defaultPath],
      ['Official portal', view.apply_url ? `<a href="${esc(view.apply_url)}">${esc(view.apply_url)}</a>` : 'Not shown']
    ];
    const sources = (Array.isArray(view.official_source_provenance) ? view.official_source_provenance : [])
      .map(src => `<li><a href="${esc(src.source_url || src.url)}">${esc(src.source_title || src.title || 'Official source')}</a></li>`)
      .join('') || '<li>No safe source URL attached; official-source retrieval is still in progress.</li>';
    const steps = (Array.isArray(view.next_steps) && view.next_steps.length ? view.next_steps : ['Use the customer-safe filing guidance above before preparing the submittal.'])
      .map(step => `<li>${esc(step)}</li>`)
      .join('');
    document.getElementById('app').innerHTML = `
      <h1>${esc(title)}</h1>
      <p class="meta">${esc(share.job_type || view.job_type || '')} — ${esc(share.city || view.city || '')}, ${esc(share.state || view.state || '')}</p>
      <p><span class="badge ${badgeClass}">${esc(status)}</span></p>
      <p><button onclick="window.print()">Print / Save PDF</button></p>
      <section><h2>Customer-visible result</h2><table>${safeRows.map(([k,v]) => `<tr><th>${esc(k)}</th><td>${typeof v === 'string' && v.includes('<a ') ? v : esc(v)}</td></tr>`).join('')}</table></section>
      <section><h2>Next steps</h2><ul>${steps}</ul></section>
      <section><h2>Coverage scope</h2><p>Fee, timeline, inspection, and companion-review details are shown only when they are safe for the customer-visible report. Plan Check Deposit / Upfront and Permit Issuance Fee components stay separate when shown.</p></section>
      <section><h2>Official sources</h2><ul>${sources}</ul></section>
    `;
  </script>
</body>
</html>
