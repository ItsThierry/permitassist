<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PermitAssist Report</title>
  <style>
    :root { --bg:#f8fafc; --card:#fff; --text:#0f172a; --muted:#64748b; --brand:#2563eb; --border:#e2e8f0; --green:#059669; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Inter,system-ui,sans-serif; background:var(--bg); color:var(--text); }
    .wrap { max-width:980px; margin:0 auto; padding:32px 20px 80px; }
    .hero { background:linear-gradient(135deg, rgba(37,99,235,.09), rgba(255,255,255,.96)); border:1px solid rgba(37,99,235,.15); border-radius:24px; padding:28px; margin-bottom:18px; }
    .brand { display:flex; align-items:center; gap:12px; margin-bottom:18px; }
    .mark { width:44px; height:44px; border-radius:14px; background:var(--brand); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; }
    .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:18px; padding:22px; box-shadow:0 10px 30px rgba(15,23,42,.05); }
    .label { font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.08em; color:var(--brand); margin-bottom:10px; }
    .headline { font-size:32px; line-height:1.08; font-weight:900; margin:0 0 6px; }
    .sub { color:var(--muted); font-size:15px; overflow-wrap:anywhere; }
    .pill { display:inline-flex; align-items:center; gap:8px; margin-top:14px; padding:8px 14px; border-radius:999px; background:rgba(5,150,105,.12); color:var(--green); font-weight:800; }
    .meta { display:grid; gap:12px; }
    .meta-row { display:flex; justify-content:space-between; gap:16px; padding-bottom:12px; border-bottom:1px solid var(--border); font-size:14px; }
    .meta-row:last-child { border-bottom:none; padding-bottom:0; }
    ul { margin:0; padding-left:18px; }
    li { margin:8px 0; color:#334155; }
    .cta { margin-top:18px; background:#0f172a; color:#fff; border-radius:20px; padding:20px; display:flex; align-items:center; justify-content:space-between; gap:16px; }
    .cta a, .print-btn { background:#fff; color:#0f172a; text-decoration:none; border:none; border-radius:12px; padding:12px 16px; font-weight:800; cursor:pointer; }
    .source-list a { color:var(--brand); overflow-wrap:anywhere; }
    .decision-matrix { grid-column:1 / -1; }
    .decision-list { display:grid; gap:10px; }
    .decision-row { border:1px solid var(--border); border-radius:14px; padding:14px 16px; background:#f8fafc; }
    .decision-row-head { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .decision-family { font-weight:850; color:#0f172a; }
    .decision-status { display:inline-flex; align-items:center; border-radius:999px; padding:5px 10px; font-size:11px; font-weight:900; letter-spacing:.04em; text-transform:uppercase; }
    .decision-status.required { background:rgba(5,150,105,.12); color:#047857; }
    .decision-status.not-required { background:rgba(71,85,105,.12); color:#475569; }
    .decision-status.verify { background:rgba(217,119,6,.14); color:#92400e; }
    .decision-status.conditional { background:rgba(37,99,235,.12); color:#1d4ed8; }
    .decision-status.needs-input { background:rgba(124,58,237,.12); color:#6d28d9; }
    .decision-detail { margin-top:7px; color:#475569; font-size:13px; line-height:1.45; }
    .decision-route { margin-top:7px; color:#64748b; font-size:12px; }
    .decision-route a { color:var(--brand); font-weight:750; }
    @media (max-width: 760px) { .grid { grid-template-columns:1fr; } .headline { font-size:26px; } .cta { flex-direction:column; align-items:flex-start; } .decision-row-head { align-items:flex-start; flex-direction:column; } }
    @media print {
      body { background:#fff; }
      .wrap { max-width:none; padding:0; }
      .cta, .print-actions { display:none !important; }
      .card, .hero { box-shadow:none; break-inside:avoid; }
      a { color:#000; text-decoration:none; }
    }
  </style>
</head>
<body>
  <div class="wrap" id="app"></div>
  <script id="report-data" type="application/json">__REPORT_DATA__</script>
  <script>
    const payload = JSON.parse(document.getElementById('report-data').textContent);
    const share = payload.share || {};
    const d = share.data || {};
    const checklist = payload.checklist || {};
    const safeArray = (value) => Array.isArray(value) ? value : [];
    const manifest = d.permit_manifest && d.permit_manifest.schema_version === 'permit_manifest_v1' ? d.permit_manifest : null;
    const primaryPermit = manifest && manifest.primary && typeof manifest.primary === 'object' ? manifest.primary : {};
    const manifestRows = manifest ? [primaryPermit, ...safeArray(manifest.companions)] : [];
    const firstPermit = primaryPermit;
    const textValue = (value, fallback = '') => {
      if (value === null || value === undefined) return fallback;
      return String(value);
    };
    const permitName = textValue(d.permit_name || d.permit_type || primaryPermit.permit_type || firstPermit.permit_type, 'Permit details');
    const allowedStatuses = new Set(['REQUIRED','NOT_REQUIRED','CONDITIONAL','VERIFY','NEEDS_INPUT']);
    const rawVerdict = textValue(manifest && manifest.permit_decision).toUpperCase();
    const verdict = allowedStatuses.has(rawVerdict) ? rawVerdict : 'NEEDS_INPUT';
    const isRequired = verdict === 'REQUIRED';
    const isNotRequired = verdict === 'NOT_REQUIRED';
    const verdictLabel = {
      REQUIRED: 'Permit status: Required',
      NOT_REQUIRED: 'Permit status: Not required',
      CONDITIONAL: 'Permit status: Conditional',
      VERIFY: 'Permit status: Verify',
      NEEDS_INPUT: 'Permit status: Needs input',
    }[verdict];
    const feeDisplay = isNotRequired
      ? textValue(d.fee_estimate, 'No primary permit fee')
      : textValue(d.fee_range || d.fee_estimate, 'Call to confirm');
    const timeline = textValue((d.approval_timeline && (d.approval_timeline.simple || d.approval_timeline.complex)) || d.timeline, 'Varies by jurisdiction');
    const docs = [...new Set([...safeArray(d.what_to_bring), ...safeArray(d.requirements), ...safeArray(d.documents_needed), ...safeArray(d.checklist)].map(x => textValue(x)).filter(Boolean))];
    const inspectionLabel = (item) => {
      if (typeof item === 'string') return item;
      if (!item || typeof item !== 'object') return '';
      return textValue(item.stage || item.title || item.name || item.description);
    };
    const inspections = safeArray(d.inspections || d.inspections_required || d.inspection_checklist).map(inspectionLabel).filter(Boolean);
    const sources = safeArray(d.sources);
    const sourceUrl = (src) => typeof src === 'string' ? src : ((src && src.url) || '');
    const safeExternalUrl = (url, fallback = '') => {
      const raw = String(url || '').trim();
      if (!raw) return fallback;
      try {
        const parsed = new URL(raw);
        const current = new URL(window.location.href);
        const samePermitAssistReport = parsed.origin === current.origin && /^\/(?:report|share)(?:\/|$)/i.test(parsed.pathname);
        if ((parsed.protocol === 'http:' || parsed.protocol === 'https:') && !samePermitAssistReport) return parsed.href;
      } catch {}
      return fallback;
    };
    const sourceHost = (url) => {
      try { return new URL(url).hostname.replace(/^www\./,''); } catch { return 'official source'; }
    };
    const sourceTitle = (src) => textValue((src && typeof src === 'object' && (src.title || src.name || src.label)) || sourceHost(sourceUrl(src)), 'official source');
    const looksLikeRawUrl = (value) => /^https?:\/\//i.test(String(value || '').trim());
    const applyPath = d.apply_path && typeof d.apply_path === 'object' ? d.apply_path : {};
    const applyPathLabel = primaryPermit.portal_selection || firstPermit.portal_selection || applyPath.likely_path || applyPath.label || applyPath.permit_path;
    const applyOffice = looksLikeRawUrl(d.applying_office) ? '' : d.applying_office;
    const applyAddress = looksLikeRawUrl(d.apply_address) ? '' : d.apply_address;
    const applyPhone = looksLikeRawUrl(d.apply_phone) ? '' : d.apply_phone;
    const applyContactLabel = [applyOffice, applyAddress, applyPhone].filter(Boolean).join(' • ');
    const whereToApply = textValue(applyContactLabel || applyPathLabel, 'Contact local building department');
    const permitOfficeMapsUrl = safeExternalUrl(payload.permit_office_maps_url);
    const permitRows = manifestRows.filter(row => row && typeof row === 'object');
    const verificationTasks = safeArray(d.verification_tasks).filter(row => row && typeof row === 'object');
    const familyKey = (row) => textValue(row && (row.family || row.filing_family || row.permit_kind || row.kind || row.permit_type)).trim().toLowerCase();
    const familyTitle = (family) => textValue(family)
      .replace(/[_-]+/g, ' ')
      .replace(/\b\w/g, char => char.toUpperCase());
    const humanizeTrigger = (value) => textValue(value)
      .replace(/[_-]+/g, ' ')
      .replace(/\bti\b/gi, 'TI')
      .replace(/^\w/, char => char.toUpperCase());
    const decisionStatus = (raw) => {
      if (raw === true) return { label: 'Required', className: 'required' };
      if (raw === false) return { label: 'Not required', className: 'not-required' };
      const status = textValue(raw).trim().toUpperCase();
      if (status === 'REQUIRED' || status === 'YES' || status === 'PERMIT_REQUIRED') {
        return { label: 'Required', className: 'required' };
      }
      if (status === 'NOT_REQUIRED' || status === 'NO' || status === 'NO_PERMIT_REQUIRED') {
        return { label: 'Not required', className: 'not-required' };
      }
      if (status === 'CONDITIONAL') return { label: 'Conditional', className: 'conditional' };
      if (status === 'VERIFY') return { label: 'Verify', className: 'verify' };
      return { label: 'Needs input', className: 'needs-input' };
    };
    const canonicalFamilyRows = manifestRows.length ? manifestRows : safeArray(d.family_decisions);
    const decisionRows = (canonicalFamilyRows.length ? canonicalFamilyRows : permitRows).map((row) => {
      const family = familyKey(row);
      const permitRow = canonicalFamilyRows.length
        ? (permitRows.find(candidate => familyKey(candidate) === family) || {})
        : row;
      const task = verificationTasks.find(candidate => familyKey(candidate) === family) || {};
      const status = decisionStatus(row.verdict || row.required_status || row.decision || permitRow.required_status || permitRow.decision || permitRow.required);
      const trigger = status.className === 'verify'
        ? textValue(task.action || row.trigger || row.required_if || permitRow.trigger || permitRow.required_if)
        : humanizeTrigger(row.trigger || row.required_if || permitRow.trigger || permitRow.required_if);
      return {
        family,
        label: textValue(permitRow.permit_type || permitRow.permit_name || row.permit_type || row.permit_name, `${familyTitle(family)} Permit`),
        status,
        trigger,
        authority: textValue(row.authority || row.applying_office || permitRow.authority || permitRow.applying_office),
        applyUrl: safeExternalUrl(row.apply_url || permitRow.apply_url),
      };
    });

    const el = (tag, options = {}, children = []) => {
      const node = document.createElement(tag);
      if (options.className) node.className = options.className;
      if (options.text !== undefined) node.textContent = textValue(options.text);
      if (options.style) node.setAttribute('style', options.style);
      if (options.attrs) {
        for (const [name, value] of Object.entries(options.attrs)) {
          if (value !== null && value !== undefined && value !== '') node.setAttribute(name, String(value));
        }
      }
      for (const child of children) {
        if (child === null || child === undefined) continue;
        node.appendChild(typeof child === 'string' ? document.createTextNode(child) : child);
      }
      return node;
    };
    const addText = (parent, tag, options = {}, children = []) => {
      const node = el(tag, options, children);
      parent.appendChild(node);
      return node;
    };
    const listCard = (title, items, fallback) => {
      const card = el('div', { className: 'card' });
      addText(card, 'div', { className: 'label', text: title });
      const ul = addText(card, 'ul');
      const finalItems = (items && items.length ? items : [fallback]).map(x => textValue(x)).filter(Boolean);
      for (const item of finalItems) addText(ul, 'li', { text: item });
      return card;
    };
    const metaRow = (label, value) => el('div', { className: 'meta-row' }, [
      el('strong', { text: label }),
      el('span', { text: value }),
    ]);

    const app = document.getElementById('app');
    const fragment = document.createDocumentFragment();

    const hero = addText(fragment, 'section', { className: 'hero' });
    const brand = addText(hero, 'div', { className: 'brand' });
    addText(brand, 'div', { className: 'mark', text: 'PA' });
    const brandCopy = addText(brand, 'div');
    addText(brandCopy, 'div', { text: 'PermitAssist', style: 'font-weight:900;font-size:20px' });
    addText(brandCopy, 'div', { className: 'sub', text: 'Permit Intelligence Report' });

    const printActions = addText(hero, 'div', {
      className: 'print-actions',
      style: 'display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap'
    });
    const heroText = addText(printActions, 'div');
    addText(heroText, 'h1', { className: 'headline', text: permitName });
    addText(heroText, 'div', { className: 'sub', text: `${textValue(share.job_type)} in ${textValue(share.city)}, ${textValue(share.state)}` });
    addText(heroText, 'div', { className: 'pill', text: verdictLabel });
    const printButton = addText(printActions, 'button', { className: 'print-btn', text: '🖨️ Print / Save PDF' });
    printButton.addEventListener('click', () => window.print());

    const grid = addText(fragment, 'section', { className: 'grid' });
    const coreCard = addText(grid, 'div', { className: 'card' });
    addText(coreCard, 'div', { className: 'label', text: 'Core details' });
    const meta = addText(coreCard, 'div', { className: 'meta' });
    meta.appendChild(metaRow('Jurisdiction', `${textValue(share.city)}, ${textValue(share.state)}`));
    meta.appendChild(metaRow('Permit', permitName));
    meta.appendChild(metaRow('Fees', feeDisplay));
    meta.appendChild(metaRow('Timeline', timeline));
    meta.appendChild(metaRow(isRequired ? 'Where to apply' : 'Office to contact', whereToApply));
    if (permitOfficeMapsUrl) {
      const mapsRow = addText(meta, 'div', { className: 'meta-row' });
      addText(mapsRow, 'strong', { text: 'Directions' });
      addText(mapsRow, 'a', {
        text: 'Open in Google Maps',
        attrs: { href: permitOfficeMapsUrl, target: '_blank', rel: 'noopener noreferrer' }
      });
    }

    const summaryCard = addText(grid, 'div', { className: 'card' });
    addText(summaryCard, 'div', { className: 'label', text: 'Summary' });
    addText(summaryCard, 'div', {
      className: 'sub',
      style: 'color:#334155',
      text: d.job_summary || d.permit_summary || d.customer_next_step || d.customer_headline || 'Permit requirements generated from PermitAssist research.'
    });

    if (decisionRows.length) {
      const matrixCard = addText(grid, 'div', { className: 'card decision-matrix' });
      addText(matrixCard, 'div', { className: 'label', text: 'Permit decision matrix' });
      addText(matrixCard, 'div', {
        className: 'sub',
        style: 'margin-bottom:14px;color:#475569',
        text: 'Every permit family in the sealed decision is shown below. Verify lanes are not approvals or denials.'
      });
      const decisionList = addText(matrixCard, 'div', { className: 'decision-list' });
      for (const row of decisionRows) {
        const decisionRow = addText(decisionList, 'div', {
          className: 'decision-row',
          attrs: { 'data-family': row.family, 'data-status': row.status.className }
        });
        const rowHead = addText(decisionRow, 'div', { className: 'decision-row-head' });
        addText(rowHead, 'div', { className: 'decision-family', text: row.label });
        addText(rowHead, 'div', { className: `decision-status ${row.status.className}`, text: row.status.label });
        if (row.trigger) addText(decisionRow, 'div', { className: 'decision-detail', text: row.trigger });
        if (row.authority || (row.status.className === 'REQUIRED' && row.applyUrl)) {
          const route = addText(decisionRow, 'div', { className: 'decision-route' });
          if (row.authority) addText(route, 'span', { text: `Authority: ${row.authority}` });
          if (row.authority && row.status.className === 'REQUIRED' && row.applyUrl) route.appendChild(document.createTextNode(' • '));
          if (row.status.className === 'REQUIRED' && row.applyUrl) addText(route, 'a', { text: 'Official application path', attrs: { href: row.applyUrl, target: '_blank', rel: 'noopener' } });
        }
      }
    }

    const documentsTitle = isRequired ? 'Required documents' : (isNotRequired ? 'Scope records & safeguards' : 'Information to verify');
    const inspectionFallback = safeArray(checklist.items).filter(i => i && i.category === 'inspection').map(i => i.label).filter(Boolean).slice(0, 8);
    const conditionalInspections = inspections.filter(item => /\b(?:conditional|companion|if|when|trigger)\b/i.test(item));
    const noPermitInspectionText = textValue(
      d.inspection_booking,
      'No primary permit inspection applies to the resolved scope; review separately triggered companion inspections if the scope changes.'
    );
    const inspectionItems = isNotRequired
      ? [noPermitInspectionText, ...conditionalInspections]
      : (inspections.length ? inspections : inspectionFallback);
    const inspectionTitle = isRequired ? 'Inspection checklist' : (isNotRequired ? 'Inspection status' : 'Possible inspection triggers');
    const constructionChecklistTitle = isRequired ? 'Pre-construction checklist' : (isNotRequired ? 'Scope & companion checklist' : 'Verification checklist');
    const constructionChecklistFallback = isRequired
      ? 'Pull permit before starting work'
      : (isNotRequired
        ? 'Keep the work within the resolved no-primary-permit scope and review conditional companion triggers if the scope changes.'
        : 'Confirm the permit decision and filing path with the listed authority before starting work.');
    grid.appendChild(listCard(documentsTitle, docs, isRequired ? 'Scope of work' : (isNotRequired ? 'Keep records showing that the work remained within the resolved scope.' : 'Bring these details when verifying the permit decision.')));
    grid.appendChild(listCard(inspectionTitle, inspectionItems, isRequired ? 'Confirm inspection phases with the jurisdiction.' : (isNotRequired ? noPermitInspectionText : 'Confirm whether inspections apply after the permit decision is verified.')));
    grid.appendChild(listCard(constructionChecklistTitle, safeArray(checklist.items).map(item => item && item.label).filter(Boolean), constructionChecklistFallback));

    const sourceRows = sources.map(src => ({ src, url: safeExternalUrl(sourceUrl(src)) })).filter(row => row.url);
    if (sourceRows.length) {
      const sourceCard = addText(grid, 'div', { className: 'card' });
      addText(sourceCard, 'div', { className: 'label', text: 'Sources checked' });
      const ul = addText(sourceCard, 'ul', { className: 'source-list' });
      for (const row of sourceRows) {
        const li = addText(ul, 'li');
        const link = addText(li, 'a', { attrs: { href: row.url, target: '_blank', rel: 'noopener' } });
        addText(link, 'strong', { text: sourceTitle(row.src) });
      }
    }

    const cta = addText(fragment, 'section', { className: 'cta' });
    const ctaCopy = addText(cta, 'div');
    addText(ctaCopy, 'div', { text: 'Get your own permits instantly at permitassist.io', style: 'font-size:20px;font-weight:900;margin-bottom:6px' });
    addText(ctaCopy, 'div', { text: 'Shareable permit reports, contractor checklists, and faster office handoffs.', style: 'color:rgba(255,255,255,.78)' });
    addText(cta, 'a', { text: 'Try PermitAssist', attrs: { href: safeExternalUrl(payload.app_base_url, 'https://permitassist.io') } });

    app.replaceChildren(fragment);
    document.title = `${permitName} | PermitAssist Report`;
  </script>
</body>
</html>
